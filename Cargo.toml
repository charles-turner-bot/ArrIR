[workspace]
members = ["crates/arrir-types", "crates/arrir"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/charles-turner-bot/arrir"

[workspace.dependencies]
arrir-types = { path = "crates/arrir-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package]
name = "arrir"
version = "0.1.0"
edition = "2021"
description = "A portable intermediate representation for unary array operation plans"
license = "MIT"
repository = "https://github.com/charles-turner-bot/arrir"
keywords = ["array", "intermediate-representation", "xarray", "query-plan"]
categories = ["data-structures", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
